[workspace]
members = ["crates/gaia-core", "crates/gaia-metalfx", "crates/gaia-render", "crates/gaia-render-host", "packages/game-window", "packages/render-window", "packages/render-wasm"]
resolver = "2"

# size-tuned browser build: `cargo build --profile wasm-release -p render-wasm --target wasm32-unknown-unknown`
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
