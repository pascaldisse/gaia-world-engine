[package]
name = "gaia-render-host"
version = "0.1.0"
edition = "2024"
description = "Binary command-stream host for gaia-render: decodes the JS GaiaRenderNative stream into RenderCore calls (native Metal host + shared logic for render-wasm)"
license = "MIT"

# Target-agnostic on purpose: render-wasm (wasm32) shares the Session ops, the native app shares the decoder.
[dependencies]
gaia-render = { path = "../gaia-render" }
wgpu = "30.0.0"
bytemuck = { version = "1.24.0", features = ["derive"] }
serde_json = "1"
