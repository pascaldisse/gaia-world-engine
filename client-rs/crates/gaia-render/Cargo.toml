[package]
name = "gaia-render"
version = "0.1.0"
edition = "2024"
description = "GAIA native+web renderer core: glTF 2.0 forward PBR on wgpu (Metal + WebGPU, one codebase)"
license = "MIT"

[dependencies]
wgpu = "30.0.0"
bytemuck = { version = "1.24.0", features = ["derive"] }
glam = "0.30.9"
# WGSL validation for external materials on BOTH targets (wgpu omits naga on wasm WebGPU).
naga = { version = "30.0.0", features = ["wgsl-in"] }
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names", "KHR_lights_punctual", "KHR_materials_emissive_strength", "extras"] }

serde_json = "1"

[dev-dependencies]
pollster = "0.4.0"
