[package]
name = "game-window"
version = "0.1.0"
edition = "2024"
description = "Native macOS host: JS game in a transparent Tauri webview over a wgpu/Metal surface drawn by gaia-render-host (internal height -> MetalFX -> surface)"
license = "MIT"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
gaia-render = { path = "../../crates/gaia-render" } # UpscaleSize / Upscaler for the MetalFX queue-mode path
gaia-render-host = { path = "../../crates/gaia-render-host" } # lane nt-ipc: Host (command-stream decoder + RenderCore session)
pollster = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["macos-private-api", "unstable"] }
wgpu = "30.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
gaia-metalfx = { path = "../../crates/gaia-metalfx" }
block2 = "0.6.2"
objc2 = "0.6"
