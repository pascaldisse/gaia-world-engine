[package]
name = "game-window"
version = "0.1.0"
edition = "2024"
description = "Native macOS host: JS game in a transparent Tauri webview over a wgpu/Metal surface drawn by gaia-render (internal height -> MetalFX -> surface)"
license = "MIT"

[features]
# EXACTLY ONE host feature (compile_error otherwise). No silent fallback between them.
#   host-ipc  = the real gaia_render_host::Host (lane nt-ipc). Needs the `gaia-render-host` dep line below UNCOMMENTED
#               once client-rs/crates/gaia-render-host exists; build with --no-default-features --features host-ipc.
#   stub-host = local stand-in (clears the target, counts command bytes, prints a loud STUB banner). Default until nt-ipc lands.
default = ["stub-host"]
host-ipc = []
stub-host = []

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
gaia-render = { path = "../../crates/gaia-render" } # RenderCore::OPTIONAL_FEATURES (device features the host asks for)
# gaia-render-host = { path = "../../crates/gaia-render-host" } # <- nt-ipc: uncomment with feature host-ipc
pollster = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["macos-private-api", "unstable"] }
wgpu = "30.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
gaia-metalfx = { path = "../../crates/gaia-metalfx" }
block2 = "0.6.2"
objc2 = "0.6"
