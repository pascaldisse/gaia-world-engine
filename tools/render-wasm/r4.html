  const buf = await (await fetch('/asylum.glb')).arrayBuffer();

  const t1 = performance.now();
  const gltf = await new GLTFLoader().parseAsync(buf, '/');

  const scene = new THREE.Scene(); scene.add(gltf.scene);
  let meshes = 0, skinned = 0, tris = 0; const mats = new Set(), toCull = [];

    const p = new THREE.Vector3(); ch.skeleton.bones[0].getWorldPosition(p); R.character = { name: ch.name, root: p.toArray() };

  const toLight = new THREE.Vector3(0.4, 0.8, 0.3).normalize();

  scene.add(sun);

  let amb = null;
  if (MODE === 'three') { amb = new THREE.AmbientLight(0xffffff, 1); amb.color.setRGB(AMBIENT[0] * Math.PI, AMBIENT[1] * Math.PI, AMBIENT[2] * Math.PI); scene.add(amb); } // core: ambient*albedo (no 1/π)

  const cpu = { mixer: [], sync: [], submit: [], total: [] }, gpuP = [], gpuThree = [], draws = [];
  const animate = (f) => { const t = performance.now(); mixer.setTime(tAt(f)); cpu.mixer.push(performance.now() - t); };
  if (MODE === 'gaia') {

    const { createWgpuBackend } = await import('/kernel/wgpu-backend.js');
    const { createSceneAdapter } = await import('/kernel/scene-adapter.js');

    const tp = performance.now(); let conv = 0;

    const ts = performance.now(); adapter.sync(scene, cam); R.first_sync_ms = performance.now() - ts;

    }
    const g = (await Promise.all(gpuP)).filter(Boolean);
    R.gpu_ms = { total: stat(g.map((x) => x.total)), scene: stat(g.map((x) => x.scene)), samples: g.length, nulls: gpuP.length - g.length };
    R.skin_uploads = adapter.stats.skinUploads; R.adapter = { created: adapter.stats.created, updated: adapter.stats.updated, degraded: [...adapter.stats.degraded], unsupported: [...adapter.stats.unsupported] };

    R.instances_last = backend.gpu.instanceCount();

    renderer.shadowMap.enabled = num('shadows', 1) !== 0; renderer.shadowMap.type = THREE.PCFShadowMap;

    animate(0); const ts = performance.now(); await renderer.compileAsync?.(scene, cam); R.first_sync_ms = performance.now() - ts; cpu.mixer.length = 0;
    let tsNull = 0; scene.matrixWorldAutoUpdate = false; // we update once per frame ourselves (counted in `sync`)
    for (let f = 0; f < FRAMES; f++) {
      await raf();
      animate(f);
      const a = performance.now(); scene.updateMatrixWorld(true); const b = performance.now();
      renderer.render(scene, cam); const c = performance.now();

} catch (e) { R.error = String(e.stack || e); }

</script>
